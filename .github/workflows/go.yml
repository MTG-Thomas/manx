name: go
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: true
      - name: make check
        run: make check
      - name: build binaries
        run: |
          mkdir -p out
          GOFLAGS=-mod=mod go build -o out/manx ./cmd/manx
          GOFLAGS=-mod=mod go build -o out/manx-tui ./cmd/manx-tui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manx-binaries-${{ github.sha }}
          path: |
            out/manx
            out/manx-tui
          retention-days: 30
