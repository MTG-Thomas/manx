name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 7 * * 4"  # weekly thursday, offset to avoid the rush
permissions:
  security-events: write
  contents: read
  actions: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [go]
    steps:
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          category: "/language:${{ matrix.language }}"
