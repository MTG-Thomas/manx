name: govulncheck
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangorg/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
