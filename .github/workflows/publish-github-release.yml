name: publish-github-release
# Runs AFTER dry-run-release greens on a tag; creates the GitHub Release with
# immutable assets (never re-uploaded â€” a fix means a new tag).
on:
  workflow_run:
    workflows: ["dry-run-release"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ github.event.workflow_run.head_branch }}
          path: dist
      - name: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            dist/out.iso
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
          body: |
            Verify: `sha256sum -c SHA256SUMS`, then keyless cosign
            `verify-blob` with `SHA256SUMS.sigstore.json` (README "Verifying a release").
            Bench acceptance per docs/rescue/MANX-SPEC.md Â§8b.6 + Â§10.7/Â§10.8 sets.
            See SECURE-BOOT.md for the trust chain (no MOK enrollment required for the standard boot).
