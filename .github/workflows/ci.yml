name: ci
on:
  pull_request: {}
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: true
      - name: make check
        run: make check
      - name: go build (race)
        run: go build -race ./...
