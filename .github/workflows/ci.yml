name: ci
on:
  pull_request: {}
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: stable
          cache: true
      - name: make check
        run: make check
      - name: go build (race)
        run: go build -race ./...
