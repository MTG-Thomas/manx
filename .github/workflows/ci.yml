name: ci
on:
  pull_request: {}
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: make check
        run: make check
      - name: go build (race)
        run: go build -race ./...
