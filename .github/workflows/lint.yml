name: lint
on:
  pull_request: {}
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck file >/dev/null
      - name: shellcheck (overlay + autorun + build)
        run: |
          set -e
          shellcheck --severity=style manx-iso/toolkit-overlay/bin/*.sh manx-iso/toolkit-overlay/autorun/*.sh manx-iso/build/*.sh 2>&1
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (parse + policy lint on every workflow)
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/al.tgz
          tar -xzf /tmp/al.tgz actionlint
          ./actionlint -color=false -version
          ./actionlint -color=false
