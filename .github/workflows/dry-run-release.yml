name: dry-run-release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write        # cosign keyless via GitHub OIDC

jobs:
  dry-run-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: manx-iso-${{ github.ref_name }}
          merge-multiple: true
          path: dist
      - name: verify expected artifact set
        run: |
          set -e
          test -f dist/out.iso || { echo "ISO missing"; exit 1; }
          test -f dist/SHA256SUMS.parts || { echo "manifest missing"; exit 1; }
      - name: secrets scan (ISO contains no secrets — policy)
        run: |
          set -e
          # high-entropy bearer prefixes + PEM private-key blocks
          if grep -aE 'bfen_[0-9A-Za-z_-]{30,}|BEGIN [A-Z ]*PRIVATE KEY' dist/out.iso; then
            echo "secret-shaped string found in the ISO - release blocked"; exit 1
          fi
          if find . -maxdepth 3 -name '*.pem' -o -name '*.key' -o -name auth.json \
             | grep -q .; then echo "key/credential file staged in dist - blocked"; exit 1; fi
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum out.iso > SHA256SUMS
          sha256sum manx manx-tui >> SHA256SUMS
      - name: cosign sign SHA256SUMS (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          curl -fsSL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o cosign
          chmod +x cosign
          ./cosign sign-blob --yes --upload=false --output-signature SHA256SUMS.sig dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/out.iso
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          retention-days: 90
