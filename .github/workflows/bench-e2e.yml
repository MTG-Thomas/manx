name: bench-e2e
# OPT-IN ONLY lane: e2e boot/acceptance of a built ISO on *MTG-owned* bench hardware.
#
# POLICY (hard rule, not a preference):
#   Bench testing runs on MTG-infrastructure ONLY. Never on customer or
#   customer-site equipment (that includes any device at a customer site, on a
#   customer LAN, or reachable through customer-managed virtualization), because
#   a public repo's opt-in self-hosted job must never carry agent code onto some-
#   one else's compute. The bench runner self-identifies with a label registered
#   by us, on hardware we own, on a network we control, with a MTG-scoped ID.
#
# Guardrails (public repo, self-hosted runner):
#   - NO pull_request trigger ever; dispatch only (org member, bench environment
#     protection requires a reviewer before the self-hosted runner starts)
#   - inputs carry the upstream build run id; the runner consumes that artifact
#     set only (build stays in the CI lane; this is validation, not building)
#   - runner output goes to the workflow summary; a bench failure is advisory and
#     never gates or deletes anything
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub run id of the iso-linux build to boot-test
        required: true
      test_set:
        description: "acceptance set: 8b.6 | 10.7 | 10.8 (default: all)"
        required: false
        default: all
        type: choice
        options:
          - all
          - 8b.6
          - "10.7"
          - "10.8"

permissions:
  contents: read

jobs:
  bench:
    runs-on: [self-hosted, manx-bench]
    environment: bench
    env:
      BENCH_RUN_ID: ${{ inputs.run_id }}
      BENCH_TEST_SET: ${{ inputs.test_set || 'all' }}
    steps:
      - name: scope guard (never trust inputs to build code here)
        run: |
          set -euo pipefail
          case "$BENCH_RUN_ID" in
            ''|*[!0-9]*) echo "run_id must contain only decimal digits" >&2; exit 2 ;;
          esac
          case "$BENCH_TEST_SET" in
            all|8b.6|10.7|10.8) ;;
            *) echo "unsupported test_set" >&2; exit 2 ;;
          esac
          echo "runner: $(uname -a)" >> "$GITHUB_STEP_SUMMARY"
          printf 'This bench boot-tests the artifact set produced by run %s.\n' "$BENCH_RUN_ID"
          echo "It does NOT compile code; a validation-only lane."

      - name: lock to the referenced artifact set
        run: |
          set -e
          # bench-side helper (runner profile, NOT this repo) fetches the artifact
          # set produced by the validated run id; the runner token is scoped to
          # actions:read on MTG-Thomas/manx only (least privilege).
          # It lands artifacts under $RUNNER_TEMP (ephemeral); never /toolkit.
          manx-bench-fetch "$BENCH_RUN_ID"
          test -f "$RUNNER_TEMP/manx-iso/out.iso" || { echo "ISO not fetched"; exit 1; }
          sha256sum "$RUNNER_TEMP/manx-iso/out.iso" >> "$GITHUB_STEP_SUMMARY"

      - name: boot-test per spec (delegated, least-privilege bench script)
        run: |
          # owned by the bench profile (/opt/manx-bench/boot-test.sh): attaches the ISO as
          # virtual media on the bench Dell (iDRAC), one-time boot to virtual CD, captures
          # net-up + detect-hw output, writes bench-summary for the workflow summary.
          sudo /opt/manx-bench/boot-test.sh \
            --iso "$RUNNER_TEMP/manx-iso/out.iso" \
            --set "$BENCH_TEST_SET" \
            2>&1 | tee bench-summary.md
          cp bench-summary.md "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: record outcome (advisory)
        if: always()
        run: |
          case "$BENCH_RUN_ID" in
            ''|*[!0-9]*) run_label='<invalid>' ;;
            *) run_label="$BENCH_RUN_ID" ;;
          esac
          case "$BENCH_TEST_SET" in
            all|8b.6|10.7|10.8) set_label="$BENCH_TEST_SET" ;;
            *) set_label='<invalid>' ;;
          esac
          {
            echo "## bench result"
            echo ""
            printf 'run: [%s] set: %s\n' "$run_label" "$set_label"
            echo ""
            tail -50 bench-summary.md 2>/dev/null || echo "(no summary captured)"
          } >> "$GITHUB_STEP_SUMMARY"
